[build]
  # Static site deployment - no build command needed
  publish = "site"
  
[build.environment]
  # No Node.js required for static site
  
[context.production]
  publish = "site"

[context.deploy-preview]
  publish = "site"

[context.branch-deploy]
  publish = "site"

# Redirects for SPA or missing files
[[redirects]]
  from = "/reports/*"
  to = "/reports/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"