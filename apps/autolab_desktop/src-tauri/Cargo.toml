[package]
name = "autolab_desktop"
version = "0.1.0"
description = "Desktop wrapper for HYMetaLab AutoLab Studio"
authors = ["HYMetaLab"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["api-all"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
